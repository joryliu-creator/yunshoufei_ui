[pytest]
testpaths = tests
addopts = -ra --browser chromium --tracing retain-on-failure --screenshot only-on-failure --video retain-on-failure
markers =
    side_effect: 会修改测试环境数据的端到端用例
    account(role): 指定用例使用的账号别名；未指定时读取 --account-role、TEST_ACCOUNT_ROLE 或 default
    customer(customer_id): 指定用例所属客户号；未指定时读取 --customer-id、CUSTOMER_ID 或 MASTER_CUSTOMER_ID
